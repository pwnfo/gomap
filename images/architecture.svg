<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1184 248" width="1184" height="248" fill="none">
  <style>
    .box { stroke: #24292F; stroke-width: 1.3; fill: none; }
    .group { stroke: #57606A; stroke-width: 1.2; stroke-dasharray: 5 4; fill: none; }
    .wire { stroke: #57606A; stroke-width: 1.25; fill: none; }
    .wire-dash { stroke: #57606A; stroke-width: 1.2; stroke-dasharray: 4 3; fill: none; }
    .head { fill: #57606A; }
    .title { fill: #1F2328; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; font-size: 12.5px; font-weight: 600; }
    .sub { fill: #57606A; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10.5px; }
    .edge { fill: #24292F; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px; }

    @media (prefers-color-scheme: dark) {
      .box { stroke: #C9D1D9; }
      .group { stroke: #8B949E; }
      .wire { stroke: #8B949E; }
      .wire-dash { stroke: #8B949E; }
      .head { fill: #8B949E; }
      .title { fill: #F0F6FC; }
      .sub { fill: #8B949E; }
      .edge { fill: #C9D1D9; }
    }
  </style>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 1 1.5 L 8.5 5 L 1 8.5 z" class="head"/>
    </marker>
  </defs>

  <!-- Column 1: Inputs -->
  <rect x="14" y="24" width="130" height="48" rx="3" class="box"/>
  <text x="79" y="45" text-anchor="middle" class="title">CLI Pattern</text>
  <text x="79" y="61" text-anchor="middle" class="sub">internal/cli</text>

  <rect x="14" y="92" width="130" height="48" rx="3" class="box"/>
  <text x="79" y="113" text-anchor="middle" class="title">.gmap Script</text>
  <text x="79" y="129" text-anchor="middle" class="sub">internal/script</text>

  <rect x="14" y="172" width="130" height="48" rx="3" class="box"/>
  <text x="79" y="193" text-anchor="middle" class="title">Wordlists (^)</text>
  <text x="79" y="209" text-anchor="middle" class="sub">os.File</text>

  <!-- Connectors: Inputs -> Lexer -->
  <path d="M 144 48 L 166 48 L 166 74 L 188 74" class="wire" marker-end="url(#arr)"/>
  <path d="M 144 116 L 166 116 L 166 94 L 188 94" class="wire" marker-end="url(#arr)"/>

  <!-- Column 2: Lexer -->
  <rect x="192" y="52" width="130" height="64" rx="3" class="box"/>
  <text x="257" y="80" text-anchor="middle" class="title">Lexer</text>
  <text x="257" y="98" text-anchor="middle" class="sub">pkg/gomap/token.go</text>

  <!-- Lexer -> AST Compiler -->
  <line x1="322" y1="84" x2="386" y2="84" class="wire" marker-end="url(#arr)"/>
  <text x="354" y="76" text-anchor="middle" class="edge">[][]Token</text>

  <!-- Column 3: AST Compiler -->
  <rect x="390" y="52" width="136" height="64" rx="3" class="box"/>
  <text x="458" y="80" text-anchor="middle" class="title">AST Compiler</text>
  <text x="458" y="98" text-anchor="middle" class="sub">pkg/gomap/node.go</text>

  <!-- Wordlists (^) -> AST Compiler -->
  <path d="M 144 196 L 458 196 L 458 120" class="wire-dash" marker-end="url(#arr)"/>
  <text x="300" y="189" text-anchor="middle" class="edge">FileNode (sync.Once)</text>

  <!-- AST Compiler -> Analyzer -->
  <line x1="526" y1="84" x2="582" y2="84" class="wire" marker-end="url(#arr)"/>
  <text x="554" y="76" text-anchor="middle" class="edge">*Plan</text>

  <!-- Column 4: Analyzer -->
  <rect x="586" y="52" width="142" height="64" rx="3" class="box"/>
  <text x="657" y="80" text-anchor="middle" class="title">BigInt Analyzer</text>
  <text x="657" y="98" text-anchor="middle" class="sub">pkg/gomap/engine.go</text>

  <!-- Analyzer -> -st / -stats branch -->
  <line x1="657" y1="116" x2="657" y2="168" class="wire-dash" marker-end="url(#arr)"/>
  <text x="676" y="146" class="edge">-st</text>
  <rect x="594" y="172" width="126" height="48" rx="3" class="group"/>
  <text x="657" y="193" text-anchor="middle" class="title">Stats &amp; Preview</text>
  <text x="657" y="209" text-anchor="middle" class="sub">O(1) WordAtIndex</text>

  <!-- Analyzer -> Generator -->
  <line x1="728" y1="84" x2="790" y2="84" class="wire" marker-end="url(#arr)"/>
  <text x="759" y="76" text-anchor="middle" class="edge">[idx, n]</text>

  <!-- Column 5: Generator Group -->
  <rect x="794" y="18" width="166" height="136" rx="3" class="group"/>
  <text x="877" y="36" text-anchor="middle" class="sub">generator.go</text>

  <rect x="806" y="46" width="142" height="44" rx="3" class="box"/>
  <text x="877" y="65" text-anchor="middle" class="title">Fixed Odometer</text>
  <text x="877" y="80" text-anchor="middle" class="sub">in-place []byte</text>

  <rect x="806" y="98" width="142" height="44" rx="3" class="box"/>
  <text x="877" y="117" text-anchor="middle" class="title">Mixed-Radix</text>
  <text x="877" y="132" text-anchor="middle" class="sub">dynamic &amp; &lt;@k=v&gt;</text>

  <!-- Generator -> Worker Pool -->
  <line x1="960" y1="84" x2="1004" y2="84" class="wire" marker-end="url(#arr)"/>
  <text x="982" y="76" text-anchor="middle" class="edge">[]byte</text>

  <!-- Column 6: Worker Pool & Stream I/O -->
  <rect x="1008" y="52" width="162" height="64" rx="3" class="box"/>
  <text x="1089" y="80" text-anchor="middle" class="title">Worker Pool</text>
  <text x="1089" y="98" text-anchor="middle" class="sub">runner.go (sync.Pool)</text>

  <line x1="1089" y1="116" x2="1089" y2="168" class="wire" marker-end="url(#arr)"/>
  <text x="1124" y="146" text-anchor="middle" class="edge">seq #0..k</text>

  <rect x="1008" y="172" width="162" height="48" rx="3" class="box"/>
  <text x="1089" y="193" text-anchor="middle" class="title">Buffered / Codec</text>
  <text x="1089" y="209" text-anchor="middle" class="sub">zstd · gzip · bz2 · xz</text>
</svg>
